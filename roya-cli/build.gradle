plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
}

application {
    mainClass = 'com.akilisha.oss.roya.cli.RoyaCli'
}

tasks.withType(JavaCompile) {
    options.compilerArgs += [
            '--enable-preview'
    ]
}

tasks.withType(Test) {
    jvmArgs += [
            '--enable-preview'
    ]
}


plugins {
    id 'java-library'
}

dependencies {
    // API dependency
    api project(":roya-api")

    // Helidon Níma - Virtual thread-native HTTP server
    implementation 'io.helidon.webserver:helidon-webserver:4.0.3'
    implementation 'io.helidon.webserver:helidon-webserver-cors:4.0.3'
    api 'io.helidon.webserver:helidon-webserver-websocket:4.0.3'
    implementation 'io.helidon.webserver:helidon-webserver-sse:4.0.3'
    // Helidon Config
    implementation 'io.helidon.config:helidon-config:4.0.3'

    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    // Helidon Health
    implementation 'io.helidon.health:helidon-health:4.0.3'
    implementation 'io.helidon.health:helidon-health-checks:4.0.3'

    // Helidon Tracing (Zipkin or OTEL backend selectable via config)
    implementation 'io.helidon.tracing:helidon-tracing:4.0.3'
    implementation 'io.helidon.openapi:helidon-openapi:4.0.3'

    // Helidon Reactive Streams (Single/Multi)
    implementation 'io.helidon.reactive:helidon-reactive-streams:4.0.3'

    // Helidon SE features
    implementation 'io.helidon.fault-tolerance:helidon-fault-tolerance:4.0.3'
    implementation 'io.helidon.scheduling:helidon-scheduling:4.0.3'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.10'
    runtimeOnly 'ch.qos.logback:logback-classic:1.4.14'
    // Logstash JSON encoder (optional; used when structured logging is enabled)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}

test {
    useJUnitPlatform()
}

// Enable FFM features for Java 23
tasks.withType(JavaCompile) {
    options.compilerArgs += [
            '--enable-preview'
    ]
}

tasks.withType(Test) {
    jvmArgs += [
            '--enable-preview'
    ]
}

plugins {
    id 'java-library'
}

dependencies {
    // API dependency
    api project(":roya-api")

    // Helidon Níma - Virtual thread-native HTTP server
    implementation "io.helidon.webserver:helidon-webserver:${helidonVersion}"
    implementation "io.helidon.webserver:helidon-webserver-cors:${helidonVersion}"
    implementation "io.helidon.webserver:helidon-webserver-websocket:${helidonVersion}"
    implementation "io.helidon.webserver:helidon-webserver-sse:${helidonVersion}"
    // Helidon Config
    implementation "io.helidon.config:helidon-config:${helidonVersion}"

    // JSON processing
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Helidon Health
    implementation "io.helidon.health:helidon-health:${helidonVersion}"
    implementation "io.helidon.health:helidon-health-checks:${helidonVersion}"

    // Helidon Tracing (Zipkin or OTEL backend selectable via config)
    implementation "io.helidon.tracing:helidon-tracing:${helidonVersion}"
    implementation "io.helidon.openapi:helidon-openapi:${helidonVersion}"

    // Helidon Reactive Streams (Single/Multi)
    implementation "io.helidon.webserver:helidon-webserver-websocket:${helidonVersion}"

    // Helidon websockets
    implementation "io.helidon.common:helidon-common-reactive:${helidonVersion}"

    // Helidon SE features
    implementation "io.helidon.fault-tolerance:helidon-fault-tolerance:${helidonVersion}"
    implementation "io.helidon.scheduling:helidon-scheduling:${helidonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    // Logstash JSON encoder (optional; used when structured logging is enabled)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}

test {
    useJUnitPlatform()
}

// Enable FFM features for Java 23
tasks.withType(JavaCompile) {
    options.compilerArgs += [
            '--enable-preview'
    ]
}

tasks.withType(Test) {
    jvmArgs += [
            '--enable-preview'
    ]
}

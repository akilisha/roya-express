plugins {
    id 'application'
}

dependencies {
    implementation project(":roya-api")
    implementation project(":roya-core")
    implementation project(":roya-plugins:ai")
    implementation project(":roya-plugins:database")
    implementation ("com.akilisha.oss:roya-workflow:1.0.0-SNAPSHOT")

    // LangChain4j core (for Prompt and PromptTemplate types)
    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-code-execution-engine-judge0:1.8.0-beta15"
    implementation "dev.langchain4j:langchain4j-mcp:1.8.0-beta15"  // For MCP GitHub example
    implementation "dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.8.0-beta15"  // For Customer Support Agent
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"  // For OpenAiTokenizer

    // JOOQ for database operations (used in Tutorial 09: Persistent Memory)
    implementation "org.jooq:jooq:${jooqVersion}"

    // JSON parsing
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

application {
    // Default main class (can be overridden per tutorial)
    mainClass = 'com.akilisha.oss.roya.examples.langchain4j.tutorial01_basic_llm.Tutorial01BasicLLM'
}

// Enable preview features
tasks.withType(JavaCompile) {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(Test) {
    jvmArgs += ['--enable-preview']
}

tasks.named('run') {
    jvmArgs += ['--enable-preview']
}

// Individual tutorial tasks (similar to roya-examples structure)
tasks.register('runTutorial01', JavaExec) {
    group = 'langchain4j-tutorials'
    description = 'Run Tutorial 01: Basic LLM Usage'
    mainClass = 'com.akilisha.oss.roya.examples.langchain4j.tutorial01_basic_llm.Tutorial01BasicLLM'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ['--enable-preview']

    // Pass API keys from environment
    String apiKey = System.getenv('OPENAI_API_KEY')
    if (apiKey != null && !apiKey.isEmpty()) {
        environment 'OPENAI_API_KEY', apiKey
        systemProperty 'ai.openai.apiKey', apiKey
    }
}


plugins {
    id 'application'
}

dependencies {
    implementation project(":roya-api")
    implementation project(":roya-core")
    implementation project(":roya-plugins:database")
    implementation project(":roya-plugins:auth")
    implementation project(":roya-plugins:metrics")
    implementation project(":roya-plugins:cache")
    implementation project(":roya-plugins:email")
    // JSON parsing for examples (request body parsing in demos)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    implementation project(":roya-plugins:ai")
    
    // JOOQ for examples using database
    implementation 'org.jooq:jooq:3.18.7'
    
    // OAuth dependencies (for examples)
    implementation 'com.github.scribejava:scribejava-apis:8.3.3'
    implementation 'com.github.scribejava:scribejava-core:8.3.3'
    
    // Micrometer for MetricsDemo
    implementation 'io.micrometer:micrometer-core:1.12.0'
}

application {
    mainClass = 'com.akilisha.oss.roya.examples.HelloWorld'
}

// Allow running different examples
tasks.register('runAIShowcase', JavaExec) {
    group = 'application'
    description = 'Run AI Showcase demo'
    mainClass = 'com.akilisha.oss.roya.examples.AIShowcase'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ['--enable-preview']
    
    // Pass environment variables to the Java process
    // Check if env vars exist and pass them
    String apiKey = System.getenv('AI_OPENAI_API_KEY')
    if (apiKey == null || apiKey.isEmpty()) {
        apiKey = System.getenv('OPENAI_API_KEY')
    }
    
    if (apiKey != null && !apiKey.isEmpty()) {
        // Pass as environment variable (preferred)
        environment 'AI_OPENAI_API_KEY', apiKey
        environment 'OPENAI_API_KEY', apiKey
        // Also pass as system property as backup
        systemProperty 'ai.openai.apiKey', apiKey
    }
    
    // Also allow system property from command line
    if (project.hasProperty('ai.openai.apiKey')) {
        systemProperty('ai.openai.apiKey', project.findProperty('ai.openai.apiKey'))
        environment 'AI_OPENAI_API_KEY', project.findProperty('ai.openai.apiKey')
    }
}

// Enable FFM features for Java 23
tasks.withType(JavaCompile) {
    options.compilerArgs += [
            '--enable-preview'
    ]
}

tasks.withType(Test) {
    jvmArgs += [
            '--enable-preview'
    ]
}

tasks.named('run') {
    jvmArgs += [
            '--enable-preview'
    ]
}

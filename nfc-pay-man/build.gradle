plugins {
    id 'java'
}

group = 'com.akilisha.oss'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    // jetty
    implementation "org.eclipse.jetty:jetty-server:11.0.25"
    implementation "org.eclipse.jetty:jetty-servlet:11.0.25"
    implementation "org.eclipse.jetty:jetty-util:11.0.25"
    implementation "com.h2database:h2:2.2.220"
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "org.jboss.weld.se:weld-se-core:6.0.3.Final"

    // adyen
    implementation "com.adyen:adyen-java-api-library:21.3.0"

    // logging
    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "ch.qos.logback:logback-classic:1.5.18";

    // testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
allprojects {
    group = 'com.akilisha.oss'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    ext {
        helidonVersion = "4.3.1"
        postgresVersion = "42.7.7"
        jacksonVersion = "2.18.2"
        slf4jVersion = "2.0.17"
        jooqVersion = "3.19.27" // https://www.jooq.org/download/support-matrix
        logbackVersion = "1.5.20"
        hikaricpVersion = "6.3.0"
        picocliVersion = "4.7.6"
        assertjVersion = "3.25.1"
        junitVersion = "5.10.2"
        mockitoJunitVersion = "5.5.0"
        handlebarsVersion = "4.3.1"

        // AI libraries
        langchain4jVersion = "1.8.0"
        langgraph4jVersion = "1.7.2"
        googleadkVersion = "0.3.0"

        // OpenAI SDK (legacy - for backward compatibility)
        theokanningOpenAIVersion = "0.18.2"
    }
}

// Maven Publishing Configuration
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(23)  // Java 21 LTS (released Sept 2023)
        }
    }

    dependencies {
        testImplementation(platform("org.junit:junit-bom:${junitVersion}"))
        testImplementation "org.junit.jupiter:junit-jupiter"
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

def javaProjects = subprojects.findAll { it.plugins.hasPlugin('java') || it.plugins.hasPlugin('java-library') }

tasks.register('aggregateJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates aggregated Javadoc for all Roya modules.'

    def toolchainProject = javaProjects.find()
    if (toolchainProject != null) {
        def toolchains = toolchainProject.extensions.getByType(JavaToolchainService)
        javadocTool.set(toolchains.javadocToolFor {
            languageVersion = JavaLanguageVersion.of(23)
        })
    }

    dependsOn javaProjects.collect { it.tasks.named('classes') }

    source javaProjects.collect { project -> project.sourceSets.main.allJava }
    classpath = files(javaProjects.collect { project -> project.sourceSets.main.compileClasspath })

    destinationDir = layout.buildDirectory.dir("docs/javadoc").get().asFile

    options.encoding = 'UTF-8'
    if (options instanceof StandardJavadocDocletOptions) {
        def docletOptions = (StandardJavadocDocletOptions) options
        docletOptions.addBooleanOption('html5', true)
        docletOptions.addStringOption('source', '23')
        docletOptions.addBooleanOption('Xdoclint:none', true)
    }

    doFirst {
        if (options instanceof StandardJavadocDocletOptions) {
            def docletOptions = (StandardJavadocDocletOptions) options
            File previewOpts = File.createTempFile("javadoc-preview", ".opts", temporaryDir)
            previewOpts.text = "--enable-preview\n"
            def existingOptionFiles = docletOptions.optionFiles ?: []
            docletOptions.optionFiles = existingOptionFiles + previewOpts
        }

        if (javadocTool.present) {
            println "Using Javadoc tool: ${javadocTool.get().metadata.installationPath} (Java ${javadocTool.get().metadata.languageVersion.asInt()})"
        } else {
            println "Using default Javadoc tool from current JDK"
        }
    }
}

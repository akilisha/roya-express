allprojects {
    group = 'com.akilisha.oss'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// Maven Publishing Configuration
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)  // Java 21 LTS (released Sept 2023)
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

plugins {
    id 'java-library'
}

dependencies {
    // Core dependencies
    implementation project(':roya-api')

    // Cache plugin (optional - for AI response caching)
    implementation project(':roya-plugins:cache')

    // AI Provider SDKs
    // OpenAI Java SDK (unofficial but popular)
    implementation 'com.theokanning.openai-gpt3-java:service:0.18.2'

    // Langchain4j temporarily removed; using OpenAI SDK + Qdrant REST directly for MVP

    // JSON for structured outputs
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Token counting (tiktoken4j for accurate token counting)
    implementation 'com.knuddels:jtokkit:1.0.0'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // HTTP client for OpenAI API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoJunitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoJunitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += ['--enable-preview']
}


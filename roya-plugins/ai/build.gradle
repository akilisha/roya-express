plugins {
    id 'java-library'
}

dependencies {
    // Core dependencies
    implementation project(':roya-api')

    // Cache plugin (optional - for AI response caching)
    implementation project(':roya-plugins:cache')

    // Workflow framework for AI agent workflows
    implementation project(':roya-workflow')

    // AI Provider SDKs
    // OpenAI Java SDK (unofficial but popular)
    implementation 'com.theokanning.openai-gpt3-java:service:0.18.2'

    // AI Library Adapters - LangChain4j
    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-anthropic:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-ollama:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-mistral-ai:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-mcp:1.8.0-beta15"
    implementation "dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.8.0-beta15"
    implementation "dev.langchain4j:langchain4j-qdrant:1.8.0-beta15"
    
    // Official Qdrant Java client for direct connectivity testing
    implementation 'io.qdrant:client:1.15.0'

    // AI Library Adapters - LangGraph
    implementation "org.bsc.langgraph4j:langgraph4j-core:${langgraph4jVersion}"
    implementation "org.bsc.langgraph4j:langgraph4j-langchain4j:${langgraph4jVersion}"
    implementation "org.bsc.langgraph4j:langgraph4j-agent-executor:${langgraph4jVersion}"
    implementation "org.bsc.langgraph4j:langgraph4j-adaptive-rag:1.5.12"

    // AI Library Adapters - Google ADK
    implementation "com.google.adk:google-adk:${googleadkVersion}"
    implementation "com.google.adk:google-adk-dev:${googleadkVersion}"

    // JSON for structured outputs
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Token counting (tiktoken4j for accurate token counting)
    implementation 'com.knuddels:jtokkit:1.0.0'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // HTTP client for OpenAI API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoJunitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoJunitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += ['--enable-preview']
}


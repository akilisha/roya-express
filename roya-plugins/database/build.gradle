plugins {
    id 'java-library'
}

dependencies {
    // Core dependencies
    implementation project(':roya-api')

    // JOOQ for type-safe SQL DSL
    implementation "org.jooq:jooq:${jooqVersion}"
    implementation "org.jooq:jooq-meta:${jooqVersion}"
    implementation "org.jooq:jooq-codegen:${jooqVersion}"

    // HikariCP for connection pooling
    implementation "com.zaxxer:HikariCP:${hikaricpVersion}"

    // PostgreSQL driver
    implementation "org.postgresql:postgresql:${postgresVersion}"

    // Flyway for database migrations
    implementation 'org.flywaydb:flyway-core:11.7.2'
    // Flyway 10+ requires separate database modules (no longer bundled)
    implementation 'org.flywaydb:flyway-database-postgresql:11.7.2'

    // Helidon Config for configuration management
    implementation "io.helidon.config:helidon-config:${helidonVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
}

// JOOQ and Flyway configured and ready to use

// Enable preview features (for ScopedValue)
java {
    sourceSets.main.java.srcDirs += 'build/generated/jooq'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',
    ]
}

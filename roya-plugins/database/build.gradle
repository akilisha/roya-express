plugins {
    id 'java-library'
}

dependencies {
    // Core dependencies
    implementation project(':roya-api')

    // JOOQ for type-safe SQL DSL
    implementation 'org.jooq:jooq:3.18.7'
    implementation 'org.jooq:jooq-meta:3.18.7'
    implementation 'org.jooq:jooq-codegen:3.18.7'

    // HikariCP for connection pooling
    implementation 'com.zaxxer:HikariCP:5.0.1'

    // PostgreSQL driver
    implementation 'org.postgresql:postgresql:42.7.1'

    // Flyway for database migrations
    implementation 'org.flywaydb:flyway-core:10.7.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
}

// JOOQ and Flyway configured and ready to use

// Enable preview features (for ScopedValue)
java {
    sourceSets.main.java.srcDirs += 'build/generated/jooq'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',
    ]
}

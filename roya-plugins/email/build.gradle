plugins {
    id 'java-library'
}

dependencies {
    // Core dependencies
    implementation project(':roya-api')

    // Email provider SDKs (optional - only include what's needed)
    // SendGrid
    implementation 'com.sendgrid:sendgrid-java:4.10.2'

    // MailerSend
    // TODO: Add MailerSend SDK when available:
    // implementation 'com.mailersend:mailersend-java:2.1.0'

    // Jakarta Mail for SMTP fallback
    implementation 'jakarta.mail:jakarta.mail-api:2.1.2'
    implementation 'org.eclipse.angus:angus-mail:2.0.2'

    // Handlebars for templates
    implementation 'com.github.jknack:handlebars:4.3.1'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoJunitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoJunitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += ['--enable-preview']
}


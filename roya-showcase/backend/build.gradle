plugins {
    id 'java'
    id 'application'
}

group = 'com.akilisha.oss.roya'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Roya framework
    implementation project(':roya-core')
    implementation project(':roya-api')
    
    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
}

application {
    mainClass = 'com.akilisha.oss.roya.showcase.PlaygroundServer'
}

tasks.register('runPlayground', JavaExec) {
    group = 'application'
    description = 'Run the Roya Playground API server'
    mainClass = application.mainClass.get()
    classpath = sourceSets.main.runtimeClasspath
    
    // Default port
    systemProperty 'port', System.getProperty('port', '8080')
    
    // Use Java 23 with preview features if available
    if (file("${System.getProperty('user.home')}/.sdkman/candidates/java/23.0.2-graalce/bin/java").exists()) {
        executable = "${System.getProperty('user.home')}/.sdkman/candidates/java/23.0.2-graalce/bin/java"
        jvmArgs = ['--enable-preview']
    }
}


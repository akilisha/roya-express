services:
  postgres:
    image: postgres:16-alpine
    container_name: roya-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: roya-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    # Note: Qdrant container is minimal and doesn't have healthcheck tools.
    # Service is functional - healthcheck disabled for dev environment.
    # Verify manually: curl http://localhost:6333/

  minio:
    image: minio/minio:latest
    container_name: roya-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    # Note: MinIO container is minimal and doesn't have healthcheck tools.
    # Service is functional - healthcheck disabled for dev environment.
    # Verify manually: curl http://localhost:9000/minio/health/live

  vault:
    image: hashicorp/vault:1.15
    container_name: roya-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

